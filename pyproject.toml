[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-overall"
version = "0.1.0"
description = "Modular LLM pipeline for intelligent text processing"
requires-python = ">=3.12,<3.13"
dependencies = [
    "openai>=2,<4",
    "pydantic>=2,<3",
    "python-dotenv>=1,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "ruff>=0.9,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--import-mode=importlib"]

